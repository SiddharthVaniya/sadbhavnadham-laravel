name: Deploy to Hostinger VPS

# LIVE PRODUCTION. See note.md.
# This job must never git pull, migrate, seed, or put the app in maintenance mode.
# After tests, it only runs npm build + Laravel cache refresh on the live host.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  regression-critical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
        env:
          APP_ENV: testing

      - name: Run migrations
        run: php artisan migrate --force --no-interaction
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run critical regression suite
        run: composer run test:regression-critical
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  deploy:
    needs: regression-critical
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (npm build + cache only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"
            export DEPLOY_ALLOW_GIT_PULL=0
            export DEPLOY_ALLOW_MIGRATE=0
            export DEPLOY_ALLOW_DOWNTIME=0
            bash scripts/deploy.sh

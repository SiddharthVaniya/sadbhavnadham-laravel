name: Production CI/CD

# Live site: GitHub main -> VPS files -> npm build -> cache clear.
# Never migrate or take the site down. See CICD.md and note.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-cicd
  cancel-in-progress: false

jobs:
  test:
    name: Tests (GitHub runner only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
        env:
          APP_ENV: testing

      - name: Migrate test SQLite only
        run: php artisan migrate --force --no-interaction
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run critical regression suite
        run: composer run test:regression-critical
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  deploy:
    name: Deploy to live (sync + npm build + cache)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH sync GitHub to live, build, clear cache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then
              APP_DIR="/home/sadbhavnadham-admin/htdocs/admin.sadbhavnadham.org"
            fi
            export NVM_DIR="/root/.nvm"
            export PATH="/root/.nvm/versions/node/v24.19.0/bin:$PATH"
            cd "$APP_DIR"
            export DEPLOY_GIT_REMOTE=github
            export DEPLOY_BRANCH=main
            export DEPLOY_ALLOW_MIGRATE=0
            export DEPLOY_ALLOW_DOWNTIME=0
            bash scripts/deploy.sh

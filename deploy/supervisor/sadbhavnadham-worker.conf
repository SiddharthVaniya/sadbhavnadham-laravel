; Copy to /etc/supervisor/conf.d/sadbhavnadham-worker.conf on the VPS.
; Replace APP_DIR with the real deploy path if it differs.
;
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl restart sadbhavnadham-worker:*

[program:sadbhavnadham-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/sadbhavnadham-donate/htdocs/donate.sadbhavnadham.org/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/home/sadbhavnadham-donate/htdocs/donate.sadbhavnadham.org
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=sadbhavnadham-donate
numprocs=2
redirect_stderr=true
stdout_logfile=/home/sadbhavnadham-donate/htdocs/donate.sadbhavnadham.org/storage/logs/worker.log
stopwaitsecs=60

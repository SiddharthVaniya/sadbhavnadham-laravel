server {
    listen 80;
    server_name donate.sadbhavnadham.org;

    root /var/www/sadbhavnadonation/public;
    index index.php index.html;

    access_log /var/log/nginx/donate_access.log;
    error_log /var/log/nginx/donate_error.log;

    # Allow the main WordPress site to embed public donate pages.
    # Do not send X-Frame-Options SAMEORIGIN — it blocks cross-origin iframes
    # even when CSP frame-ancestors would otherwise allow them.
    add_header Content-Security-Policy "frame-ancestors 'self' https://sadbhavnadham.org https://www.sadbhavnadham.org" always;
    add_header X-Content-Type-Options "nosniff" always;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
